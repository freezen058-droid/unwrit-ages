# Verifies every Unwrit Ages victory certificate once a day and publishes the result as
# website/verified/certificates.json (ROADMAP "Verified once a day, no server").
#
# Configure (Settings of the GitHub repo):
#   - Actions > General > Workflow permissions: "Read and write permissions" (or keep the
#     `permissions: contents: write` below, which is enough when the org/repo allows it).
#   - Secrets (all optional):
#       SOLANA_RPC_URL         a private RPC URL; without it the public mainnet endpoint is used
#       CLOUDFLARE_API_TOKEN   + CLOUDFLARE_ACCOUNT_ID: deploy website/ to Cloudflare Pages after
#                              the report changes. Without them the report is only committed.
#   - If master is branch-protected against direct pushes, allow github-actions[bot] to push, or
#     set the secret REPORT_PUSH_TOKEN (a fine-grained PAT with Contents: read/write on this repo).
name: Verify certificates

on:
  schedule:
    - cron: "17 3 * * *"   # daily, 03:17 UTC (off the hour to avoid the scheduler rush)
  workflow_dispatch:
    inputs:
      recheck:
        description: "Re-verify every cached certificate"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: verify-certificates
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Secrets cannot be read in `if:`; expose only whether the deploy one is set.
      CAN_DEPLOY: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.REPORT_PUSH_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests (offline)
        run: python -m unittest discover -s tools/verify -v

      - name: Verify certificates
        env:
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          # The public endpoint throttles hard; slow down when no private RPC is configured.
          RPC_MIN_INTERVAL: ${{ secrets.SOLANA_RPC_URL != '' && '0.1' || '0.5' }}
        run: |
          python tools/verify/verify_certificates.py ${{ inputs.recheck && '--recheck' || '' }}

      - name: Commit the report if it changed
        id: commit
        run: |
          git add website/verified/certificates.json
          if git diff --cached --quiet; then
            echo "Report unchanged."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # [skip ci]: a report update must not trigger the Android build workflows on push.
          git commit -m "Verified certificates: daily report [skip ci]"
          git pull --rebase --autostash
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy the site to Cloudflare Pages
        if: steps.commit.outputs.changed == 'true' && env.CAN_DEPLOY == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # Same command as the manual deploy (MPL-NOTICE.md), run from the repo root so functions/
        # (the /rpc proxy) is deployed with the site.
        run: npx --yes wrangler pages deploy website --project-name unwritages --branch main
